global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'no-reply@gmail.com'
  smtp_auth_username: 'no-reply@gmail.com'
  smtp_auth_password: 'SENHA_APP_DO_GOOGLE'
  smtp_require_tls: true

route:
  receiver: email-receiver
  group_interval: 60s
  repeat_interval: 86400s
  group_by: [...]
  group_wait: 30s
  routes:
  - match:
      job: "cadvisor"
      severity: "URGENTE"
      alertname: " Alerta - Aplicação com o status code diferente de 200 "
    receiver: "email-receiver"
    continue: true

receivers:
  - name: 'email-receiver'
    email_configs:
      - to: 'suporte@gmail.com'
        send_resolved: true
