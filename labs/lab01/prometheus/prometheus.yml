global:
  scrape_interval: 120s
  evaluation_interval: 120s

alerting:
  alertmanagers:
    - scheme: http
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - alerts.rules

scrape_configs:

  - job_name: prometheus
    scrape_interval: 10s
    static_configs:
      - targets: [prometheus:9090]

  - job_name: alertmanager
    scrape_interval: 10s
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: node
    scrape_interval: 10s
    static_configs:
      - targets: [nodeexporter:9100]

  - job_name: loki
    scrape_interval: 10s
    static_configs:
      - targets: [loki:3100]

  - job_name: promtail
    scrape_interval: 10s
    static_configs:
      - targets: [promtail:9080]

  - job_name: cadvisor
    scrape_interval: 10s
    static_configs:
      - targets: [cadvisor:8080]